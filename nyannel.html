// 日付を 2ちゃんねる風フォーマットに（YYYY/MM/DD(曜) HH:MM:SS.ss）
function formatDate(d) {
  const days = ["日", "月", "火", "水", "木", "金", "土"];
  const y = d.getFullYear();
  const mo = String(d.getMonth() + 1).padStart(2, "0");
  const da = String(d.getDate()).padStart(2, "0");
  const w = days[d.getDay()];
  const h = String(d.getHours()).padStart(2, "0");
  const mi = String(d.getMinutes()).padStart(2, "0");
  const s = String(d.getSeconds()).padStart(2, "0");
  const cs = String(Math.floor(d.getMilliseconds() / 10)).padStart(2, "0");
  return `${y}/${mo}/${da}(${w}) ${h}:${mi}:${s}.${cs}`;
}

// IDっぽいランダム文字列を生成（8文字：英数字）
function makeId() {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
  let s = "";
  for (let i = 0; i < 8; i++) {
    s += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  return s;
}

// HTMLエスケープ
function esc(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 過去日時のDateを作るヘルパー（初期データ用・分単位でずらす）
function ago(minutes) {
  return new Date(Date.now() - minutes * 60 * 1000);
}

/* ---------- 本文レンダリング（改行＋アンカー変換） ---------- */

function renderBody(body) {
  // まずエスケープ
  let safe = esc(body);
  // >>数字 をアンカー化（複数レス >>1-3 は簡易に先頭番号へ）
  safe = safe.replace(/&gt;&gt;(\d+)/g, (m, n) => {
    return `<span class="anchor" data-target="${n}">&gt;&gt;${n}</span>`;
  });
  // 改行を <br>
  safe = safe.replace(/\n/g, "<br>");
  return safe;
}

/* ---------- アンカーのジャンプ＆ポップアップ ---------- */

function attachAnchorEvents() {
  const popup = document.getElementById("anchor-popup");

  document.querySelectorAll(".anchor").forEach((a) => {
    const target = parseInt(a.getAttribute("data-target"), 10);

    // クリックでジャンプ＋ハイライト
    a.addEventListener("click", (e) => {
      e.preventDefault();
      const el = document.getElementById("res-" + target);
      if (el) {
        el.scrollIntoView({ behavior: "smooth", block: "center" });
        el.classList.add("highlight");
        setTimeout(() => el.classList.remove("highlight"), 1500);
      }
    });

    // ホバーでポップアップ表示
    a.addEventListener("mouseenter", (e) => {
      const t = threads.find((x) => x.id === view.threadId);
      if (!t) return;
      const p = t.posts[target - 1];
      if (!p) return;
      const name = p.name && p.name.trim() !== "" ? p.name : "名無しにゃん";
      popup.innerHTML =
        `<div class="res-head"><span class="res-num">${target}</span> ：` +
        `<span class="res-name">${esc(name)}</span> ：` +
        `<span class="res-date">${formatDate(p.date)}</span> ` +
        `<span class="res-id">ID:${esc(p.id)}</span></div>` +
        `<div class="res-body">${renderBody(p.body)}</div>`;
      popup.style.display = "block";
      positionPopup(e, popup);
    });

    a.addEventListener("mousemove", (e) => {
      if (popup.style.display === "block") positionPopup(e, popup);
    });

    a.addEventListener("mouseleave", () => {
      popup.style.display = "none";
      popup.innerHTML = "";
    });
  });
}

function positionPopup(e, popup) {
  const offset = 14;
  let x = e.pageX + offset;
  let y = e.pageY + offset;
  const pw = popup.offsetWidth;
  const vw = document.documentElement.clientWidth;
  // 右端はみ出し防止
  if (x + pw > window.scrollX + vw) {
    x = e.pageX - pw - offset;
    if (x < window.scrollX) x = window.scrollX + 4;
  }
  popup.style.left = x + "px";
  popup.style.top = y + "px";
}

  const title = titleEl.value.trim();
  const body = bodyEl.value.trim();

  if (title === "") {
    alert("スレッドタイトルを入力してください。");
    titleEl.focus();
    return;
  }
  if (body === "") {
    alert("本文（1レス目）を入力してください。");
    bodyEl.focus();
    return;
  }

  const newThread = {
    id: nextThreadId++,
    title: title,
    posts: [
      { name: "", body: body, date: new Date(), id: makeId(), sage: false },
    ],
  };
  threads.push(newThread);

  // 作成したスレッドを開く
  openThread(newThread.id);
}

/* ---------- アクション：レス書き込み ---------- */

function addPost(threadId) {
  const t = threads.find((x) => x.id === threadId);
  if (!t) return;

  const nameEl = document.getElementById("post-name");
  const bodyEl = document.getElementById("post-body");
  const sageEl = document.getElementById("post-sage");

  const name = nameEl.value.trim();
  const body = bodyEl.value.trim();
  const sage = sageEl.checked;

  if (body === "") {
    alert("本文を入力してください。");
    bodyEl.focus();
    return;
  }

  t.posts.push({
    name: name,          // 空欄なら表示時に「名無しにゃん」
    body: body,
    date: new Date(),
    id: makeId(),
    sage: sage,          // sageならスレッドを上げない（一覧の並びは最終レス日時なので影響）
  });

  // 再描画。sageでなければ最新レスへスクロールされるようリレンダ
  const targetNum = t.posts.length;
  renderThread();
  const el = document.getElementById("res-" + targetNum);
  if (el) {
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    el.classList.add("highlight");
    setTimeout(() => el.classList.remove("highlight"), 1500);
  }
}

/* ---------- ナビゲーション ---------- */

function openThread(id) {
  view.page = "thread";
  view.threadId = id;
  renderThread();
}

function goList() {
  view.page = "list";
  view.threadId = null;
  renderList();
  window.scrollTo(0, 0);
}

/* ---------- 起動 ---------- */

document.getElementById("nav-home").addEventListener("click", (e) => {
  e.preventDefault();
  goList();
});

seedData();
renderList();

</script>
