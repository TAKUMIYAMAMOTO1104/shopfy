# ============================================================
# ContentLab Tokyo - AI自律型コンテンツ工場 経営設定 (CEO: Jobs)
# ============================================================
# 顔出しなし・ビジネス/自己啓発ジャンル・YouTube長尺+Shorts/TikTok・日英展開
# このファイルがビジネスの「定款」です。
# オーナーは原則ここだけ編集すれば経営方針が変わります。
# ============================================================

business:
  name: "ContentLab Tokyo"
  genre: "business_self_development"  # ビジネス・自己啓発・キャリア・副業
  brand_voice: "calm-authoritative"    # 落ち着いた権威性 (TED的なトーン)
  budget_jpy_monthly: 100000
  formats:
    - long       # YouTube長尺 (8〜12分・広告収益主体)
    - shorts     # YouTube Shorts / TikTok / Reels (60秒・拡散主体)
  markets:
    - jp
    - en
  owner_name: "Owner"
  ceo_name: "Jobs"

# 月予算の内訳 (動画ビジネスは外注編集と素材調達がメインコスト)
budget_allocation:
  editing_jpy: 50000        # 動画編集 (外注エディター or AI動画ツール)
  thumbnail_jpy: 10000      # サムネ素材・有償素材
  ads_jpy: 30000            # 初動ブースト広告
  api_and_ops_jpy: 10000    # Claude APIなど

# AI従業員の編成 (コワーキング型: 全員が共有チャットに参加する)
employees:
  ceo:
    title: "CEO"
    model: "claude-sonnet-4-6"
  trend_researcher:
    title: "トレンドリサーチ部長"
    model: "claude-sonnet-4-6"
    topics_per_run: 3
  scriptwriter:
    title: "脚本家"
    model: "claude-sonnet-4-6"
    shorts_per_topic: 3       # 1つの長尺から派生させるShortsの数
  director:
    title: "演出ディレクター"
    model: "claude-sonnet-4-6"
  cfo:
    title: "CFO"
    model: "claude-haiku-4-5-20251001"

operations:
  trends_dir: "data/content/trends"
  scripts_dir: "data/content/scripts"
  production_dir: "data/content/production"
  reports_dir: "data/reports"
  state_file: "data/state.json"
  cowork_dir: "data/cowork"
  simulation_mode: true
